name: Scrape Klook Prices

on:
  schedule:
    # Daily at 16:00 UTC (00:00 midnight Taiwan time, 23:00 Bangkok time)
    - cron: '0 16 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Scrape Klook prices
        run: node scripts/scrape-klook.js
        env:
          SCRAPE_RETRIES: '3'
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}

      - name: Fetch exchange rates
        run: node scripts/fetch-rates.js

      - name: Rebuild site with updated prices
        run: node src/build.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage prices data and all rebuilt HTML files
          git add data/
          git add *.html blog/*.html
          git add de/ fr/ hi/ ja/ ko/ lo/ ms/ ru/ vi/ zh-CN/ zh-TW/
          git diff --staged --quiet || git commit -m "chore: update prices from Klook [$(date -u +%Y-%m-%d)]"
          git push

      - name: Upload debug data if scrape had issues
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-data
          path: data/debug-klook.md
          if-no-files-found: ignore
          retention-days: 7
