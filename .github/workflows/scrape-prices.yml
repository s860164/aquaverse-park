name: Scrape Klook Prices

on:
  schedule:
    # Daily at 06:00 UTC (13:00 Bangkok time)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Scrape Klook prices
        run: node scripts/scrape-klook.js
        env:
          SCRAPE_RETRIES: '3'

      - name: Fetch exchange rates
        run: node scripts/fetch-rates.js

      - name: Update website files
        run: node scripts/update-site.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ tickets.html index.html js/main.js
          git add de/ fr/ hi/ ja/ ko/ lo/ ms/ ru/ vi/ zh-CN/ zh-TW/
          git diff --staged --quiet || git commit -m "chore: update prices from Klook [$(date -u +%Y-%m-%d)]"
          git push

      - name: Upload debug screenshot if scrape failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: debug-screenshot.png
          if-no-files-found: ignore
          retention-days: 7
